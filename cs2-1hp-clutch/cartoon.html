<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>1 HP против пятерых</title>
<style>
  html,body{margin:0;background:#111;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{height:100vh;width:auto;max-width:100vw;aspect-ratio:9/16;display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================
//  «1 HP против пятерых» — 2D-мультфильм 9:16
//  renderFrame(t) детерминированно рисует кадр в момент t (сек).
// =====================================================================
const W = 1080, H = 1920, DURATION = 37;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Noto Sans","DejaVu Sans",Arial,sans-serif';
const EMOJI = '"Noto Color Emoji"';

// ---------- утилиты ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const elastic = k => k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;
function rand(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function shakeXY(t, amp, seed = 1) { return [Math.sin(t * 61 + seed) * amp + Math.sin(t * 37 + seed * 3) * amp * .5, Math.cos(t * 53 + seed * 2) * amp + Math.sin(t * 29) * amp * .4]; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillRR(x, y, w, h, r, fill, stroke, lw = 6) { rr(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function circle(x, y, r, fill, stroke, lw = 6) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function ellipse(x, y, rx, ry, fill, stroke, lw = 6, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function line(x1, y1, x2, y2, color, lw = 6) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); }
function mixColor(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, k)), g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, k)), bl = Math.round(lerp(pa & 255, pb & 255, k));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}
function bigText(txt, x, y, size, fill = '#fff', stroke = '#000', opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 900} ${size}px ${FONT},${EMOJI}`;
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (opts.rot) { ctx.translate(x, y); ctx.rotate(opts.rot); x = 0; y = 0; }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = opts.lw || size * .22; ctx.strokeText(txt, x, y); }
  if (opts.shadow) { ctx.shadowColor = opts.shadow; ctx.shadowBlur = opts.blur || 30; }
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
  ctx.restore();
}
function popIn(t, a, d = .3) { return backOut(prog(t, a, a + d)); }
function heart(x, y, s, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 30); ctx.bezierCurveTo(-60, -10, -30, -60, 0, -25); ctx.bezierCurveTo(30, -60, 60, -10, 0, 30);
  ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
// ---------- персонажи ----------
const OUT = '#1b1b2a', SKIN = '#F6C9A0';
const CAST = {
  p: { hoodie: '#2E8BFF', hoodieD: '#1D63C4', hair: 'neat', hairColor: '#3A2213', phones: '#FF3D57' },
  mom: { hoodie: '#C0392B', hoodieD: '#8E2A20', hair: 'long', hairColor: '#6A4A3A', phones: '#000', noPhones: true, bun: true },
  h: { hoodie: '#E8423F', hoodieD: '#B52A28', hair: 'neat', hairColor: '#4A2C1A', phones: '#222' },                       // мидовый герой
  c: { hoodie: '#7A8B3A', hoodieD: '#5A6828', hair: 'panama', hairColor: '#2A1A14', hat: '#C9B27A', phones: '#444' },     // кемпер
  r: { hoodie: '#FF8A1F', hoodieD: '#D06A0A', hair: 'bandana', hairColor: '#E8B04A', band: '#E0122B', phones: '#222' },   // вечный A
  m: { hoodie: '#8E5BE8', hoodieD: '#6A3FBF', hair: 'beanie', hairColor: '#222', beanie: '#3BC4D0', phones: '#444' },     // тиммейт
  e: { hoodie: '#555F7A', hoodieD: '#3A4258', hair: 'beanie', hairColor: '#222', beanie: '#C0392B', phones: '#222' },     // враг
};
function hand(x, y, s = 1, fill = SKIN) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ellipse(0, 0, 48, 42, fill, OUT, 8);
  for (let i = -1; i <= 1; i++) ellipse(i * 26, -36, 14, 20, fill, OUT, 6);
  ctx.restore();
}
function drawChar(who, x, y, s, o = {}) {
  const c = CAST[who], t = o.t || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); if (o.rot) ctx.rotate(o.rot);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  let skin = SKIN;
  if (o.redness) skin = mixColor(skin, '#FF3B2F', o.redness);
  if (o.pale) skin = mixColor(skin, '#E8F0F2', o.pale);
  // длинные волосы сзади
  if (c.hair === 'long') {
    ctx.beginPath(); ctx.moveTo(-175, -40); ctx.quadraticCurveTo(-200, 200, -150, 330); ctx.lineTo(150, 330); ctx.quadraticCurveTo(200, 200, 175, -40); ctx.closePath();
    ctx.fillStyle = c.hairColor; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke();
  }
  // ноги (бег)
  if (o.legs !== undefined) {
    for (const sd of [-1, 1]) {
      ctx.save(); ctx.translate(sd * 70, 500); ctx.rotate(Math.sin(o.legs + (sd > 0 ? Math.PI : 0)) * .6);
      fillRR(-36, -20, 72, 230, 30, '#2A2F45', OUT, 8); ellipse(10, 215, 58, 32, '#1b1b2a');
      ctx.restore();
    }
  }
  // тело
  if (!o.headOnly) {
    ctx.beginPath(); ctx.moveTo(-210, 520); ctx.quadraticCurveTo(-220, 230, -95, 170); ctx.lineTo(95, 170); ctx.quadraticCurveTo(220, 230, 210, 520); ctx.closePath();
    ctx.fillStyle = c.hoodie; ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = OUT; ctx.stroke();
    line(-35, 190, -42, 290, '#fff', 7); line(35, 190, 42, 290, '#fff', 7);
    fillRR(-110, 360, 220, 110, 30, c.hoodieD, OUT, 7);
    fillRR(-45, 120, 90, 70, 20, mixColor(SKIN, '#C08060', .3), OUT, 7);
    if (o.gun) drawGun(o.gun, o.gunRot || 0);
    if (o.bowtie) {
      const k = o.bowtie;
      ctx.save(); ctx.translate(0, 185); ctx.scale(k, k);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-70, -38); ctx.lineTo(-70, 38); ctx.closePath(); ctx.moveTo(0, 0); ctx.lineTo(70, -38); ctx.lineTo(70, 38); ctx.closePath();
      ctx.fillStyle = '#E0122B'; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = OUT; ctx.stroke(); circle(0, 0, 16, '#B00010', OUT, 6);
      ctx.restore();
    }
  }
  // голова
  circle(-150, 10, 34, skin, OUT, 8); circle(150, 10, 34, skin, OUT, 8);
  ellipse(0, 0, 150, 160, skin, OUT, 9);
  const expr = o.expr || 'neutral';
  if (o.blush || expr === 'sweet' || expr === 'love' || c.girl) { ctx.globalAlpha = c.girl ? .5 : (o.blush ?? .6); ellipse(-92, 62, 30, 17, '#FF6E8A'); ellipse(92, 62, 30, 17, '#FF6E8A'); ctx.globalAlpha = 1; }
  // волосы
  if (c.hair === 'neat' || c.hair === 'cap' || c.hair === 'beanie') {
    ctx.beginPath(); ctx.moveTo(-152, -10);
    ctx.quadraticCurveTo(-170, -150, -40, -170); ctx.quadraticCurveTo(110, -185, 152, -60); ctx.lineTo(152, -10);
    ctx.quadraticCurveTo(120, -90, 40, -95); ctx.quadraticCurveTo(-20, -60, -80, -100); ctx.quadraticCurveTo(-130, -60, -152, -10);
    ctx.fillStyle = c.hairColor; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke();
  }
  if (c.hair === 'long') { // чёлка
    ctx.beginPath(); ctx.moveTo(-160, 0); ctx.quadraticCurveTo(-175, -170, 0, -175); ctx.quadraticCurveTo(175, -170, 160, 0);
    ctx.quadraticCurveTo(130, -80, 60, -90); ctx.quadraticCurveTo(20, -50, -10, -95); ctx.quadraticCurveTo(-60, -50, -90, -95); ctx.quadraticCurveTo(-140, -70, -160, 0);
    ctx.fillStyle = c.hairColor; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke();
  }
  // наушники (у девушки — с кошачьими ушками)
  if (c.bun) { circle(0, -190, 70, c.hairColor, OUT, 8); }
  if (!c.noPhones) {
  ctx.beginPath(); ctx.arc(0, -10, 178, Math.PI * 1.08, Math.PI * 1.92); ctx.lineWidth = 26; ctx.strokeStyle = OUT; ctx.stroke(); ctx.lineWidth = 14; ctx.strokeStyle = c.girl ? c.phones : '#444'; ctx.stroke();
  if (c.girl) for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * 70, -165); ctx.lineTo(sd * 125, -250); ctx.lineTo(sd * 150, -130); ctx.closePath(); ctx.fillStyle = c.phones; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke(); }
  fillRR(-195, -40, 58, 110, 24, c.phones, OUT, 8); fillRR(137, -40, 58, 110, 24, c.phones, OUT, 8);
  }
  // кепка задом наперёд / шапка
  if (c.hair === 'cap') {
    ctx.beginPath(); ctx.moveTo(-150, -60); ctx.quadraticCurveTo(-140, -200, 0, -200); ctx.quadraticCurveTo(140, -200, 150, -60); ctx.closePath();
    ctx.fillStyle = c.cap; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke();
    fillRR(-60, -80, 120, 30, 12, mixColor(c.cap, '#000', .25), OUT, 6); // козырёк сзади (виден ремешок)
  }
  if (c.hair === 'beanie') {
    ctx.beginPath(); ctx.moveTo(-158, -50); ctx.quadraticCurveTo(-150, -215, 0, -215); ctx.quadraticCurveTo(150, -215, 158, -50); ctx.closePath();
    ctx.fillStyle = c.beanie; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke();
    fillRR(-165, -80, 330, 46, 20, mixColor(c.beanie, '#000', .2), OUT, 7);
    circle(0, -225, 26, '#fff', OUT, 6);
  }
  if (c.hair === 'panama') {
    ellipse(0, -95, 230, 55, c.hat, OUT, 8);
    ctx.beginPath(); ctx.moveTo(-140, -95); ctx.quadraticCurveTo(-135, -225, 0, -225); ctx.quadraticCurveTo(135, -225, 140, -95); ctx.closePath();
    ctx.fillStyle = c.hat; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke();
    fillRR(-140, -125, 280, 28, 8, mixColor(c.hat, '#000', .3), OUT, 5);
  }
  if (c.hair === 'bandana') {
    ctx.beginPath(); ctx.moveTo(-150, -20);
    const sp = [[-170, -120], [-120, -110], [-120, -220], [-60, -160], [-20, -240], [20, -165], [70, -235], [90, -160], [160, -180], [140, -100], [165, -60], [150, -20]];
    for (const [px, py] of sp) ctx.lineTo(px, py); ctx.closePath();
    ctx.fillStyle = c.hairColor; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 151, 161, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = c.band; ctx.fillRect(-160, -120, 320, 46); ctx.restore();
    ctx.beginPath(); ctx.moveTo(140, -100); ctx.lineTo(220, -60 + Math.sin(t * 14) * 15); ctx.lineTo(205, -120 + Math.sin(t * 14) * 10); ctx.closePath(); ctx.fillStyle = c.band; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.stroke();
  }
  if (o.ghost) { ctx.save(); ctx.globalAlpha = .9; ellipse(0, -215, 120, 26, null, '#FFE14D', 12); ctx.restore(); }
  if (o.shades) { fillRR(-115, -30, 105, 56, 18, '#111', OUT, 5); fillRR(10, -30, 105, 56, 18, '#111', OUT, 5); line(-10, -12, 10, -12, '#111', 8); }
  // глаза
  const ex = 58, ey = -5, look = o.look || [0, 0];
  const blink = o.noBlink ? 1 : (Math.sin(t * 2.1 + (who.charCodeAt(0))) > .985 ? .1 : 1);
  if (expr === 'love') {
    for (const sd of [-1, 1]) heart(sd * ex, ey, 1.25 + .12 * Math.sin(t * 12), '#FF2D6F');
  } else if (expr === 'happyClosed') {
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(sd * ex, ey + 12, 30, Math.PI * 1.1, Math.PI * 1.9); ctx.lineWidth = 10; ctx.strokeStyle = OUT; ctx.stroke(); }
  } else {
    let eyeR = 40, eyeH = 46 * blink, pupil = 18;
    if (expr === 'shock') { eyeR = 52; eyeH = 60; pupil = 8; }
    if (expr === 'sweet') { eyeR = 44; eyeH = 52; pupil = 26; }
    if (expr === 'angry') eyeH = 32;
    for (const sd of [-1, 1]) {
      const cx = sd * ex;
      ellipse(cx, ey, eyeR, eyeH, '#fff', OUT, 7);
      if (eyeH > 12) {
        circle(cx + look[0], ey + look[1], pupil, expr === 'sweet' ? '#3A2A6A' : '#222');
        circle(cx + look[0] + 7, ey + look[1] - 8, expr === 'sweet' ? 10 : 6, '#fff');
        if (expr === 'sweet') { circle(cx + look[0] - 8, ey + look[1] + 9, 5, '#fff'); }
      }
      if (c.girl) { for (let i = 0; i < 3; i++) line(cx + sd * (20 + i * 12), ey - eyeH + 4, cx + sd * (30 + i * 16), ey - eyeH - 14, OUT, 6); }
    }
  }
  // брови
  const brow = { happy: [-.15, -30], sweet: [-.25, -36], neutral: [0, -22], angry: [.5, -8], shock: [-.2, -55], love: [-.2, -40], cry: [-.45, -30], happyClosed: [-.15, -32] }[expr] || [0, -22];
  for (const sd of [-1, 1]) {
    ctx.save(); ctx.translate(sd * ex, ey - 50 + brow[1]); ctx.rotate(sd * brow[0]);
    fillRR(-38, -9, 76, c.girl ? 12 : 18, 9, mixColor(c.hairColor, '#000', .2));
    ctx.restore();
  }
  // нос
  ctx.beginPath(); ctx.moveTo(0, 30); ctx.quadraticCurveTo(-18, 62, 4, 66); ctx.lineWidth = 7; ctx.strokeStyle = mixColor(skin, '#000', .35); ctx.stroke();
  // рот
  const m = clamp(o.mouth || 0);
  ctx.save(); ctx.translate(0, 105);
  const smile = (expr === 'happy' || expr === 'sweet' || expr === 'love' || expr === 'happyClosed');
  if (expr === 'shock' && m < .1) ellipse(0, 5, 26, 34, '#5A0E14', OUT, 8);
  else if (smile && m < .1) { ctx.beginPath(); ctx.arc(0, -20, c.girl ? 36 : 52, .2, Math.PI - .2); ctx.lineWidth = 9; ctx.strokeStyle = OUT; ctx.stroke(); }
  else if (expr === 'angry' || expr === 'cry' || m > .1) {
    const big = expr === 'angry' || expr === 'cry' ? 1 : (c.girl ? .5 : .7);
    const mh = (14 + 55 * Math.max(m, (expr === 'angry' || expr === 'cry') ? .55 : 0)) * big;
    ctx.beginPath(); ctx.ellipse(0, 5, 70 * big, mh, 0, 0, Math.PI * 2); ctx.fillStyle = '#5A0E14'; ctx.fill();
    ctx.save(); ctx.clip(); fillRR(-60, 5 - mh, 120, 22, 4, '#fff'); ellipse(0, 5 + mh * .8, 40, 22, '#FF6A7A'); ctx.restore();
    ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke();
  } else if (expr === 'neutral' && o.flat) line(-30, 0, 30, 0, OUT, 9);
  else { ctx.beginPath(); ctx.arc(0, -30, 40, .5, Math.PI - .5); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke(); }
  ctx.restore();
  // слёзы
  if (expr === 'cry' || o.tears) {
    for (const sd of [-1, 1]) for (let i = 0; i < 3; i++) {
      const ph = (t * 2 + i / 3) % 1;
      circle(sd * (ex + 10 + ph * 60), ey + 40 + ph * 200, 14 * (1 - ph * .4), '#7FD3FF', OUT, 4);
    }
  }
  if (o.sweat) {
    const ph = (t * .8) % 1;
    ctx.save(); ctx.translate(120, -80 + ph * 80); ctx.globalAlpha = 1 - ph * .5;
    ctx.beginPath(); ctx.moveTo(0, -30); ctx.quadraticCurveTo(22, 5, 0, 18); ctx.quadraticCurveTo(-22, 5, 0, -30);
    ctx.fillStyle = '#7FD3FF'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = OUT; ctx.stroke(); ctx.restore();
  }
  if (o.steam) for (const sd of [-1, 1]) for (let i = 0; i < 4; i++) {
    const ph = ((t * 1.6 + i * .25) % 1); ctx.globalAlpha = (1 - ph) * .85 * o.steam;
    circle(sd * (175 + ph * 120), -ph * 160, 22 + ph * 40, '#fff'); ctx.globalAlpha = 1;
  }
  if (o.sparkle) for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + t * .8, r = 230 + Math.sin(t * 4 + i) * 20, k = .6 + .4 * Math.sin(t * 9 + i * 2);
    bigText('✨', Math.cos(a) * r, Math.sin(a) * r * .9 - 40, 60 * k * o.sparkle, '#fff', null);
  }
  ctx.restore();
}

// ---------- фоны и элементы интерфейса ----------
function roomBG(t, c1, c2) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
  const hue = (t * 120) % 360;
  for (let i = 0; i < 14; i++) { ctx.fillStyle = `hsl(${(hue + i * 30) % 360},90%,60%)`; ctx.fillRect(-100 + i * 100, 1180, 100, 14); }
}
function desk(t, glow = '#5BC8FF') {
  const g = ctx.createRadialGradient(W / 2, 1450, 50, W / 2, 1200, 900); g.addColorStop(0, glow + '44'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
  fillRR(-200, 1300, W + 400, 900, 0, '#6B4A33', OUT, 10);
  fillRR(170, 1350, 740, 260, 26, '#23232F', OUT, 10);
}
function sunburst(t, c1, c2, cx = W / 2, cy = H / 2, speed = .15) {
  ctx.fillStyle = c1; ctx.fillRect(-300, -300, W + 600, H + 600);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * speed);
  for (let i = 0; i < 18; i++) { ctx.rotate(Math.PI / 9); if (i % 2) continue; ctx.fillStyle = c2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2200, -380); ctx.lineTo(2200, 380); ctx.fill(); }
  ctx.restore();
}
function speedLines(t, cx, cy, alpha = .3) {
  ctx.save(); ctx.translate(cx, cy);
  for (let i = 0; i < 60; i++) {
    const a = rand(i) * Math.PI * 2, r0 = 450 + rand(i + 7) * 300 - ((t * 900 + i * 50) % 300);
    ctx.globalAlpha = alpha; line(Math.cos(a) * r0, Math.sin(a) * r0, Math.cos(a) * (r0 + 700), Math.sin(a) * (r0 + 700), '#fff', 4 + rand(i) * 6);
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
// голосовой чат команды
function bubble(x, y, txt, size, color, t0, t, tail = 'left') {
  const p = popIn(t, t0, .25); if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
  ctx.font = `900 ${size}px ${FONT},${EMOJI}`; const w = ctx.measureText(txt).width + 80, h = size * 1.9;
  fillRR(-w / 2, -h / 2, w, h, h / 2, '#fff', OUT, 8);
  ctx.beginPath(); const tx = tail === 'left' ? -w / 4 : w / 4; ctx.moveTo(tx - 25, h / 2 - 4); ctx.lineTo(tx + (tail === 'left' ? -50 : 50), h / 2 + 55); ctx.lineTo(tx + 25, h / 2 - 4); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke(); ctx.fillRect(tx - 22, h / 2 - 14, 44, 14);
  bigText(txt, 0, 0, size, color, null);
  ctx.restore();
}
function typeCard(t, t0, num, title, c1, c2, emoji) {
  sunburst(t, c1, c2, W / 2, 820, .4);
  const p = elastic(prog(t, t0, t0 + .6));
  ctx.save(); ctx.translate(W / 2, 700); ctx.scale(p, p); ctx.rotate(-.05);
  bigText('ТИП', 0, -170, 150, '#fff', OUT, { lw: 24 });
  bigText('№' + num, 0, 30, 300, '#FFE14D', OUT, { lw: 34 });
  ctx.restore();
  const q = popIn(t, t0 + .25, .35);
  ctx.save(); ctx.translate(W / 2, 1060); ctx.scale(q, q); ctx.rotate(.04);
  fillRR(-460, -90, 920, 180, 30, '#fff', OUT, 10);
  bigText(title, 0, 0, 84, OUT, null);
  ctx.restore();
  if (emoji) { const e = popIn(t, t0 + .4, .3); ctx.save(); ctx.translate(W / 2, 1300); ctx.scale(e, e); ctx.rotate(Math.sin(t * 8) * .15); bigText(emoji, 0, 0, 170, '#fff', null); ctx.restore(); }
}

// ---------- оружие ----------
function drawGun(kind, rot) {

    fillRR(-260, -26, 560, 52, 14, '#4E6B3A', OUT, 8);      // ложе
    fillRR(260, -12, 150, 24, 6, '#2A2E37', OUT, 6);        // ствол
    fillRR(-40, -78, 200, 42, 16, '#2A2E37', OUT, 7);       // прицел
    circle(160, -57, 16, '#7FD3FF', OUT, 5);

  } else if (kind === 'shotgun') {
    fillRR(-200, -30, 320, 60, 16, '#8A5A2E', OUT, 8);
    fillRR(110, -22, 220, 40, 10, '#3A3F4A', OUT, 7);
    fillRR(130, 16, 150, 26, 10, '#5A3A1E', OUT, 6);
  } else if (kind === 'rifle') {
    fillRR(-220, -30, 400, 60, 16, '#3A3F4A', OUT, 8);
    fillRR(180, -14, 140, 28, 6, '#2A2E37', OUT, 6);
    fillRR(20, 20, 50, 110, 12, '#2A2E37', OUT, 6);
  } else if (kind === 'flash') {
    ctx.restore(); ctx.save(); ctx.translate(150, 250);
    fillRR(-30, -60, 60, 120, 18, '#DDE4EE', OUT, 7); fillRR(-20, -80, 40, 26, 8, '#888', OUT, 5);
  }
  if (kind !== 'flash') { hand(-120, 30, 1); hand(120, 30, 1); }
  ctx.restore();
}
function shadesOn(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); fillRR(-120, -38, 110, 62, 20, '#111', OUT, 5); fillRR(10, -38, 110, 62, 20, '#111', OUT, 5); line(-10, -18, 10, -18, '#111', 8); line(-30, -20, -60, -30, 'rgba(255,255,255,.5)', 6); ctx.restore(); }

function sky(c1 = '#7FD3FF', c2 = '#FFE6B0') { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(.6, c2); g.addColorStop(1, '#E9C98C'); ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, H + 800); }
function palm(x, y, s, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-20, 0); ctx.quadraticCurveTo(-40, -250, 10, -480); ctx.lineTo(40, -480); ctx.quadraticCurveTo(10, -250, 25, 0); ctx.closePath();
  ctx.fillStyle = '#A0703C'; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = OUT; ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * .55 + Math.sin(t * 1.5 + i) * .05;
    ctx.save(); ctx.translate(25, -480); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(120, -50, 230, 30); ctx.quadraticCurveTo(120, -10, 0, 0);
    ctx.fillStyle = '#3BA34A'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}
function building(x, y, w, h, col = '#E3B877', arches = 2, dome = false) {
  fillRR(x, y - h, w, h, 10, col, OUT, 8);
  ctx.fillStyle = mixColor(col, '#000', .12); ctx.fillRect(x + 8, y - h + 8, w - 16, 22);
  for (let i = 0; i < arches; i++) {
    const aw = w / arches * .55, ax = x + (i + .5) * w / arches - aw / 2, ah = h * .45;
    ctx.beginPath(); ctx.moveTo(ax, y); ctx.lineTo(ax, y - ah + aw / 2); ctx.arc(ax + aw / 2, y - ah + aw / 2, aw / 2, Math.PI, 0); ctx.lineTo(ax + aw, y); ctx.closePath();
    ctx.fillStyle = '#5A3A22'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.stroke();
  }
  if (dome) { ctx.beginPath(); ctx.arc(x + w / 2, y - h, w * .3, Math.PI, 0); ctx.fillStyle = '#3BB0C9'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = OUT; ctx.stroke(); }
}
function street(t, scroll = 0, groundY = 1350) {
  sky();
  circle(880, 260, 90, '#FFF3B0'); // солнце
  // дальний план
  ctx.save(); ctx.translate(-((scroll * .3) % 1200), 0);
  for (let k = 0; k < 3; k++) { building(k * 1200 + 0, groundY - 250, 380, 380, '#EAC88C', 2, true); building(k * 1200 + 460, groundY - 250, 300, 300, '#E8BF80', 1); building(k * 1200 + 820, groundY - 250, 360, 420, '#EBCB90', 2); }
  ctx.restore();
  // ближний план
  ctx.save(); ctx.translate(-((scroll) % 1400), 0);
  for (let k = 0; k < 3; k++) { building(k * 1400 + 0, groundY, 520, 520, '#D9A660', 3); palm(k * 1400 + 640, groundY, 1.1, t); building(k * 1400 + 820, groundY, 460, 600, '#D49A55', 2); }
  ctx.restore();
  ctx.fillStyle = '#D8B072'; ctx.fillRect(-400, groundY, W + 800, H);
  ctx.fillStyle = 'rgba(150,100,50,.25)';
  for (let i = 0; i < 18; i++) { const x = ((i * 170 - scroll) % 1600 + 1600) % 1600 - 260; ctx.fillRect(x, groundY + 40 + (i % 3) * 120, 120, 12); }
}

// n — рассказчик, m — тиммейт, mom — мама
const LINES = [
  { id: 'n1', who: 'n', t: 0.05, d: 3.25, chunks: ['Один HP. Пятеро врагов.', 'Бомба уже стоит.'] },
  { id: 'm1', who: 'm', t: 3.5, d: 4.15, chunks: ['Брат… мы в тебя верим.', 'Ну, не очень, но верим.'] },
  { id: 'm2', who: 'm', t: 15.9, d: 3.42, chunks: ['ДАААА! ДАВАЙ!', 'ТЫ БОГ!'] },
  { id: 'mom', who: 'mom', t: 25.4, d: 2.96, chunks: ['Я ТРЕТИЙ РАЗ ЗОВУ!', 'ИДИ ЕСТЬ!'] },
  { id: 'm3', who: 'm', t: 31.0, d: 2.72, chunks: ['…Передай маме, что она', 'сыграла лучше тебя.'] },
];
const SUB_COLOR = { n: '#FFFFFF', m: '#C9A8FF', mom: '#FF8A85' };
function speaking(who, t) { for (const l of LINES) if (l.who === who && t >= l.t && t <= l.t + l.d) return true; return false; }
function mouthOf(who, t) { return speaking(who, t) ? .35 + .65 * Math.abs(Math.sin(t * 17 + who.charCodeAt(0))) * (.6 + .4 * Math.sin(t * 5.3)) : 0; }
function drawSubtitles(t) {
  for (const l of LINES) {
    if (t < l.t - .05 || t > l.t + l.d + .25) continue;
    const pages = [];
    for (let i = 0; i < l.chunks.length; i += 2) pages.push(l.chunks.slice(i, i + 2));
    const lens = pages.map(p => p.join(' ').length), total = lens.reduce((a, b) => a + b, 0);
    const k = clamp((t - l.t) / l.d) * total;
    let idx = 0, acc = 0;
    for (let i = 0; i < pages.length; i++) { if (k >= acc) idx = i; acc += lens[i]; }
    const pageStart = l.t + l.d * (lens.slice(0, idx).reduce((a, b) => a + b, 0) / total);
    const pop = l.t < .1 ? 1 : backOut(prog(t, pageStart, pageStart + .18));   // в первом кадре текст уже на экране
    const size = l.who === 'mom' ? 84 : 72;
    ctx.save(); ctx.translate(W / 2, 1560); ctx.scale(.85 + .15 * pop, .85 + .15 * pop); ctx.globalAlpha = clamp(pop * 1.5);
    pages[idx].forEach((s, j) => bigText(s, 0, j * size * 1.2, size, SUB_COLOR[l.who], '#000', { lw: size * .2 }));
    ctx.restore();
  }
}

function killfeed(t, t0, txt) {
  const p = easeOut(prog(t, t0, t0 + .25)); if (p <= 0) return;
  ctx.save(); ctx.translate(W - 30 + (1 - p) * 800, 300);
  fillRR(-600, -40, 600, 80, 12, 'rgba(0,0,0,.75)', '#FF3D3D', 4);
  bigText(txt, -300, 0, 38, '#fff', null);

}
function bigPop(t, t0, txt, y, size, color, rot = -.06) {

}

// ---------- СЦЕНЫ ----------
// 0–3.3: экстремальный крупный план глаза. Всё на экране уже с первого кадра.
function sEye(t) {
  ctx.fillStyle = '#2A0006'; ctx.fillRect(-400, -400, W + 800, H + 800);
  const [sx, sy] = shakeXY(t, 6);
  ctx.save(); ctx.translate(W / 2 + sx, 860 + sy);
  // кожа вокруг глаза
  ellipse(0, 0, 700, 520, '#F2BE92');
  // бровь (испуганно вверх)
  ctx.save(); ctx.rotate(-.12); fillRR(-420, -470, 840, 90, 45, '#3A2213'); ctx.restore();
  // белок с прожилками
  ellipse(0, 0, 520, 330, '#FFF8F2', OUT, 14);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 515, 325, 0, 0, Math.PI * 2); ctx.clip();
  for (let i = 0; i < 14; i++) {
    const a = rand(i) * Math.PI * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 520, Math.sin(a) * 330);
    ctx.quadraticCurveTo(Math.cos(a) * 380 + 30, Math.sin(a) * 240 - 20, Math.cos(a + .2) * 260, Math.sin(a + .2) * 170);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(220,40,40,.55)'; ctx.stroke();
  }
  // радужка дрожит
  const jx = Math.sin(t * 43) * 12, jy = Math.cos(t * 37) * 8;
  circle(jx, jy, 210, '#3A7AC0', OUT, 10);
  circle(jx, jy, 150, '#2A5A90');
  circle(jx, jy, 90 + Math.sin(t * 9) * 8, '#0A0A12');
  // отражение «1 HP» в зрачке
  bigText('1', jx - 10, jy, 70, 'rgba(255,60,60,.8)', null);
  circle(jx + 70, jy - 80, 38, '#fff'); circle(jx - 60, jy + 70, 16, '#fff');
  ctx.restore();
  // капли пота
  for (let i = 0; i < 2; i++) { const ph = (t * .7 + i * .5) % 1; ctx.save(); ctx.translate(420 - i * 860, -380 + ph * 200); ctx.beginPath(); ctx.moveTo(0, -50); ctx.quadraticCurveTo(36, 10, 0, 30); ctx.quadraticCurveTo(-36, 10, 0, -50); ctx.fillStyle = '#7FD3FF'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.stroke(); ctx.restore(); }
  ctx.restore();
  // гигантский «1 HP»
  const blink = Math.sin(t * 12) > -.3;
  if (blink) bigText('1 HP', W / 2, 300, 230, '#FF2A2A', '#fff', { lw: 22, shadow: '#FF0000', blur: 50 });
  // бомба и 1 vs 5
  const beep = (t * 3) % 1 < .25;
  fillRR(W / 2 - 280, 1150, 560, 130, 30, 'rgba(0,0,0,.7)', beep ? '#FF3D3D' : '#7A0010', 8);
  bigText((beep ? '🔴' : '⚫') + ' 💣 1 vs 5', W / 2, 1216, 76, '#fff', null);
}
// 3.3–7.8: отъезд — игрок у компа, мёртвые тиммейты

// 7.8–10.3: первый — хедшот
function sKill1(t) {
  const peek = easeOut(prog(t, 8.1, 8.45)), dead = t > 8.7;
  const snap = easeOut(prog(t, 8.45, 8.65));
  fpsView(t, {
    aimX: lerp(-160, 140, snap), aimY: lerp(60, -40, snap), recoil: dead && t < 8.9 ? 40 : 0, flash: dead && t < 8.8 ? 1 : 0,
    draw: () => {
      const ex = lerp(860, 680, peek);
      ctx.save(); if (dead) { ctx.translate(ex, 980); ctx.rotate(easeOut(prog(t, 8.7, 9.1)) * 1.4); ctx.translate(-ex, -980); }
      drawChar('e', ex, 760, .42, { t, expr: dead ? 'shock' : 'angry', gun: 'rifle', gunRot: .2 });
      ctx.restore();
    },
  });
  if (dead) { bigPop(t, 8.75, 'ХЕДШОТ 💀', 420, 110, '#fff'); killfeed(t, 8.75, 'ТЫ 🎯 Враг №1'); }
}
// 10.3–12.8: враг взрывает сам себя своей гранатой
function sKill2(t) {
  const boom = t > 11.6;
  fpsView(t, {
    aimX: Math.sin(t * 2) * 30,
    draw: () => {
      if (!boom) drawChar('e', 560, 760, .42, { t, expr: t > 11.2 ? 'shock' : 'happy', gun: 'rifle' });
      // траектория гранаты: от врага к стене и назад
      if (t > 10.7 && !boom) {
        const k = prog(t, 10.7, 11.6);
        const x = k < .5 ? lerp(600, 760, k * 2) : lerp(760, 590, (k - .5) * 2);
        const y = 700 - Math.sin(k * Math.PI) * 160;
        ctx.save(); ctx.translate(x, y); ctx.rotate(t * 20); fillRR(-22, -30, 44, 60, 14, '#4A6B3A', OUT, 5); ctx.restore();
      }
      if (boom) {
        const k = prog(t, 11.6, 12.1);
        for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; circle(560 + Math.cos(a) * 160 * k, 780 + Math.sin(a) * 120 * k, 70 * (1 - k * .5), i % 2 ? '#FFB23F' : '#FF5A1F'); }
        circle(560, 780, 120 * (1 - k * .6), '#FFF3B0');
      }
    },
  });
  if (boom) { bigPop(t, 11.7, 'САМ СЕБЯ 🤡', 420, 100, '#FFE14D'); killfeed(t, 11.7, 'Враг №2 💣 Враг №2'); }
}
// 12.8–15.8: дабл в прыжке, слоу-мо
function sKill3(t) {
  const slow = t > 13.3 && t < 15.0;
  sunburst(t, '#123A6A', '#1E5A9A', W / 2, 900, slow ? .05 : .4);
  speedLines(t * (slow ? .2 : 1), W / 2, 900, .2);
  const k = prog(t, 12.9, 15.2);
  const jx = lerp(140, 940, k), jy = 1100 - Math.sin(k * Math.PI) * 420;
  // враги по краям
  const d1 = t > 13.9, d2 = t > 14.5;
  ctx.save(); if (d1) { ctx.translate(140, 1250); ctx.rotate(-1.2 * easeOut(prog(t, 13.9, 14.2))); ctx.translate(-140, -1250); }
  drawChar('e', 160, 1100, .5, { t, expr: d1 ? 'shock' : 'angry', gun: 'rifle', gunRot: -.2 }); ctx.restore();
  ctx.save(); if (d2) { ctx.translate(940, 1250); ctx.rotate(1.2 * easeOut(prog(t, 14.5, 14.8))); ctx.translate(-940, -1250); }
  drawChar('e', 920, 1100, .5, { t, expr: d2 ? 'shock' : 'angry', gun: 'rifle', gunRot: .2 }); ctx.restore();
  // наш игрок в прыжке, развёрнут
  drawChar('p', jx, jy, .55, { t, expr: 'angry', noBlink: true, gun: 'rifle', rot: (k - .5) * .8, legs: 1.2 });
  // трассеры
  if (t > 13.75 && t < 14.0) { ctx.save(); ctx.shadowColor = '#FFE14D'; ctx.shadowBlur = 30; line(jx, jy + 180, 200, 1000, '#FFE14D', 12); ctx.restore(); }
  if (t > 14.35 && t < 14.6) { ctx.save(); ctx.shadowColor = '#FFE14D'; ctx.shadowBlur = 30; line(jx, jy + 180, 900, 1000, '#FFE14D', 12); ctx.restore(); }
  if (slow) { ctx.fillStyle = 'rgba(80,160,255,.12)'; ctx.fillRect(-400, -400, W + 800, H + 800); }
  if (d2) bigPop(t, 14.6, 'ДАБЛ В ПРЫЖКЕ!', 470, 96, '#FFE14D');
}

// 19.4–25.2: дуэль как в вестерне
function sDuel(t) {
  // закат
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#FF8A3C'); g.addColorStop(.55, '#FFC86A'); g.addColorStop(.56, '#C98A4A'); g.addColorStop(1, '#8A5A2A');
  ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, H + 800);
  circle(W / 2, 1030, 230, '#FFE6A0');
  // перекати-поле
  const tx = ((t - 19.4) * 260) % 1600 - 300;
  ctx.save(); ctx.translate(tx, 1290 - Math.abs(Math.sin(t * 5)) * 40); ctx.rotate(t * 4);
  for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(0, 0, 60 - i * 6, i, i + 4.5); ctx.lineWidth = 5; ctx.strokeStyle = '#8A6A3A'; ctx.stroke(); }
  ctx.restore();
  // ветер
  for (let i = 0; i < 6; i++) { const x = ((t * 500 + i * 300) % 1600) - 300; line(x, 600 + i * 90, x + 160, 600 + i * 90, 'rgba(255,255,255,.5)', 4); }
  if (t < 21.5) {
    // силуэты друг против друга
    ctx.save(); ctx.filter = 'brightness(0.25)';
    drawChar('p', 220, 1050, .62, { t, expr: 'angry', gun: 'rifle', gunRot: .4 });
    drawChar('e', 860, 1050, .62, { t, expr: 'angry', gun: 'rifle', gunRot: -.4 });
    ctx.restore();
    bigText('1 vs 1', W / 2, 420, 140, '#fff', OUT, { lw: 20 });
  } else if (t < 23.3) {
    // глаза крупно, split-screen
    ctx.fillStyle = '#000'; ctx.fillRect(-400, 560, W + 800, 10);
    ctx.save(); rr(0, 260, W, 300, 0); ctx.clip(); drawChar('p', W / 2, 560, 1.5, { t, expr: 'angry', noBlink: true, look: [16, 0], headOnly: true }); ctx.restore();
    ctx.save(); rr(0, 570, W, 300, 0); ctx.clip(); drawChar('e', W / 2, 870, 1.5, { t, expr: 'angry', noBlink: true, look: [-16, 0], headOnly: true }); ctx.restore();
    line(-400, 260, W + 400, 260, OUT, 10); line(-400, 870, W + 400, 870, OUT, 10);
  } else {
    // палец медленно тянется к кнопке мыши
    ctx.fillStyle = '#20202A'; ctx.fillRect(-400, -400, W + 800, H + 800);
    ellipse(W / 2, 1050, 300, 400, '#333', OUT, 12); line(W / 2, 650, W / 2, 900, OUT, 10);
    fillRR(W / 2 - 290, 680, 280, 220, 40, '#444', OUT, 8);
    const k = easeInOut(prog(t, 23.3, 25.1));
    ctx.save(); ctx.translate(W / 2 - 150, lerp(420, 640, k));
    fillRR(-45, -260, 90, 300, 45, SKIN, OUT, 8); ellipse(0, 20, 40, 30, '#FFE0D0', OUT, 5);
    ctx.restore();
    bigText('…', W / 2, 330, 140, '#fff', null);
  }
}
// 25.2–28.6: мама в дверях
function sMom(t) {
  roomBG(t, '#3B2E6E', '#1A1638');
  // дверь распахивается
  const k = easeOut(prog(t, 25.2, 25.45));
  fillRR(560, 230, 460, 1030, 10, '#FFE6B0', OUT, 8);              // свет из коридора
  ctx.save(); ctx.translate(560, 230); ctx.scale(lerp(1, .15, k), 1);
  fillRR(0, 0, 460, 1030, 10, '#8A5A2E', OUT, 10); circle(400, 540, 22, '#FFD24A', OUT, 5); ctx.restore();
  // мама с половником
  if (t > 25.3) {
    const [sx, sy] = shakeXY(t, 6);
    drawChar('mom', 790 + sx, 760 + sy, .8, { t, expr: 'angry', mouth: mouthOf('mom', t), steam: 1, noBlink: true, look: [-20, 0] });
    ctx.save(); ctx.translate(990, 620 + Math.sin(t * 10) * 30); ctx.rotate(-.5 + Math.sin(t * 10) * .2);
    fillRR(-12, -40, 24, 300, 10, '#B8C4D0', OUT, 6); ellipse(0, -70, 70, 50, '#B8C4D0', OUT, 7); ctx.restore();
  }
  // игрок оборачивается
  const turn = t > 28.0;
  drawChar('p', 290, 1130, .7, { t, expr: 'shock', noBlink: true, look: turn ? [30, -6] : [-10, 10], sweat: true });
  desk(t, '#5BC8FF');
  if (t > 25.4) bigPop(t, 25.4, '😱', 330, 140, '#fff', 0);
}
// 28.6–29.8: смерть
function sDeath(t) {
  fpsView(t, { draw: () => drawChar('e', 560, 760, .42, { t, expr: 'happy', gun: 'rifle' }), aimX: 300 });
  const k = prog(t, 28.6, 28.8);
  ctx.fillStyle = `rgba(160,0,0,${.6 * k})`; ctx.fillRect(-400, -400, W + 800, H + 800);
  bigPop(t, 28.65, 'ВЫ УБИТЫ', 600, 140, '#fff', 0);
  killfeed(t, 28.7, 'Враг №5 🔫 ТЫ');
}
// 29.8–33.9: тишина, потом тиммейт. Игрок ест суп.
function sSoup(t) {
  roomBG(t, '#5A4A3A', '#2A2018');
  // кухонный стол
  fillRR(-200, 1180, W + 400, 900, 0, '#B8860B', OUT, 10);
  drawChar('p', W / 2, 1000, .8, { t, expr: 'neutral', look: [0, 20] });
  ellipse(W / 2, 1250, 230, 70, '#fff', OUT, 8); ellipse(W / 2, 1240, 180, 45, '#E0702B');
  hand(W / 2 + 180, 1180, 1.3);
  // наушники на столе — из них голос тиммейта
  ctx.save(); ctx.translate(880, 1300);
  ctx.beginPath(); ctx.arc(0, 0, 90, Math.PI, 0); ctx.lineWidth = 16; ctx.strokeStyle = OUT; ctx.stroke();
  fillRR(-110, -10, 46, 80, 18, '#FF3D57', OUT, 6); fillRR(64, -10, 46, 80, 18, '#FF3D57', OUT, 6);
  if (speaking('m', t)) for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 10, 120 + i * 30 + (t * 60) % 30, -2.2, -1.0); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke(); }
  ctx.restore();
  if (t < 31.0) bigText('…', W / 2, 400, 160, '#fff', null);
}
// 33.9–37: финальная карточка
function sEnd(t) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#FF3D57'); g.addColorStop(1, '#6A2CFF');
  ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, H + 800);
  drawChar('mom', 300, 1050, .7, { t, expr: 'happy' });
  drawChar('p', 780, 1050, .7, { t, expr: 'cry', tears: true });
  const p = elastic(prog(t, 33.9, 34.6));
  ctx.save(); ctx.translate(W / 2, 360); ctx.scale(p, p); ctx.rotate(-.03 + Math.sin(t * 3) * .02);
  fillRR(-490, -150, 980, 300, 40, '#FFE14D', OUT, 12);
  bigText('ТВОЯ МАМА ТОЖЕ', 0, -50, 80, OUT, null);
  bigText('ТАК ДЕЛАЛА? 😂👇', 0, 56, 80, '#E0122B', null);
  ctx.restore();
  const q = popIn(t, 34.3, .3);
  if (q > 0) { ctx.save(); ctx.translate(300, 640); ctx.scale(q, q); ctx.rotate(-.1); fillRR(-170, -55, 340, 110, 22, '#fff', OUT, 7); bigText('MVP 🏆', 0, 0, 56, '#B00010', null); ctx.restore(); }
}

// ---------- камера ----------
const SHOTS = [
  [0, 3.3, [540, 860, 1.06, 0], [540, 840, 1.18, .02], easeIn],
  [3.3, 7.8, [540, 1000, 1.5, 0], [540, 860, 1.04, 0], easeOut],
  [7.8, 8.7, [540, 760, 1.08, 0], [640, 760, 1.25, 0], easeIn],
  [8.7, 10.3, [640, 760, 1.3, .03], [540, 860, 1.08, 0], easeOut],
  [10.3, 11.6, [540, 800, 1.1, 0], [560, 780, 1.3, 0], easeInOut],
  [11.6, 12.8, [560, 780, 1.35, -.04], [540, 860, 1.08, 0], easeOut],
  [12.8, 13.3, [300, 1000, 1.3, -.03], [400, 900, 1.2, 0], easeOut],
  [13.3, 15.0, [450, 900, 1.2, 0], [760, 850, 1.35, .04], easeInOut],
  [15.0, 15.8, [760, 900, 1.3, .04], [540, 900, 1.06, 0], easeOut],
  [15.8, 19.4, [540, 1200, 1.4, -.03], [540, 760, 1.05, .02], easeOut],
  [19.4, 21.5, [540, 1000, 1.06, 0], [540, 1000, 1.25, 0], easeIn],
  [21.5, 23.3, [540, 560, 1.06, 0], [540, 560, 1.2, 0], easeIn],
  [23.3, 25.2, [540, 700, 1.2, 0], [460, 760, 1.6, 0], easeIn],
  [25.2, 28.0, [700, 760, 1.25, .04], [600, 860, 1.06, 0], easeOut],
  [28.0, 28.6, [290, 1000, 1.3, -.03], [290, 1000, 1.45, -.03], k => k],
  [28.6, 29.8, [540, 760, 1.4, .05], [540, 800, 1.12, 0], easeOut],
  [29.8, 33.9, [540, 1000, 1.04, 0], [540, 1050, 1.25, 0], easeInOut],
  [33.9, 37, [540, 960, 1.2, 0], [540, 960, 1.04, 0], easeOut],
];
const PUNCH = [[0, .0], [3.3, .25], [8.7, .35], [11.6, .45], [13.9, .2], [14.5, .3], [15.9, .25], [19.4, .15], [21.5, .15], [25.2, .5], [28.6, .5], [33.9, .2]];
function camAt(t) {
  let fx = W / 2, fy = H / 2, z = 1.06, r = 0;
  for (const [a, b, A, B, e] of SHOTS) if (t >= a && t < b) { const k = e(prog(t, a, b)); fx = lerp(A[0], B[0], k); fy = lerp(A[1], B[1], k); z = lerp(A[2], B[2], k); r = lerp(A[3], B[3], k); break; }
  fx += Math.sin(t * .7) * 10; fy += Math.cos(t * .9) * 10; r += Math.sin(t * .5) * .006;
  let sh = 0;
  for (const [at, amt] of PUNCH) if (t >= at) { z *= 1 + amt * Math.exp(-(t - at) * 9); sh += amt * 120 * Math.exp(-(t - at) * 6); }
  fx += Math.sin(t * 71) * sh; fy += Math.cos(t * 63) * sh;
  const cover = 1 + Math.abs(r) * 2.2; z = Math.max(z, cover + .02); const ze = z / cover;
  fx = clamp(fx, W / 2 / ze, W - W / 2 / ze); fy = clamp(fy, H / 2 / ze, H - H / 2 / ze);
  return { fx, fy, z, r };
}
function flash(t, at, col = '255,255,255') { const k = 1 - Math.abs(t - at) / .1; if (k > 0) { ctx.fillStyle = `rgba(${col},${k})`; ctx.fillRect(0, 0, W, H); } }
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const c = camAt(t);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(c.r); ctx.scale(c.z, c.z); ctx.translate(-c.fx, -c.fy);
  if (t < 3.3) sEye(t);
  else if (t < 7.8) sDesk(t);
  else if (t < 10.3) sKill1(t);
  else if (t < 12.8) sKill2(t);
  else if (t < 15.8) sKill3(t);
  else if (t < 19.4) sHype(t);
  else if (t < 25.2) sDuel(t);
  else if (t < 28.6) sMom(t);
  else if (t < 29.8) sDeath(t);
  else if (t < 33.9) sSoup(t);
  else sEnd(t);
  ctx.restore();
  // HUD поверх кадра во время клатча
  if (t >= 3.3 && t < 25.2) { hpBadge(t); vsBadge(t); redPulse(t, t < 19.4 ? .3 : .15); }
  if (t < 3.3) redPulse(t, .5);
  if (t > 13.3 && t < 15.0) bigText('⏱ СЛОУ-МО', W / 2, 290, 54, '#BFE3FF', '#000', { lw: 10 });
  [3.3, 7.8, 10.3, 12.8, 15.8, 19.4, 21.5, 23.3, 29.8, 33.9].forEach(a => flash(t, a));
  flash(t, 25.2, '255,230,160'); flash(t, 28.6, '255,0,0');
  drawSubtitles(t);
}
window.renderFrame = renderFrame;
window.DURATION = DURATION;
if (!location.search.includes('render')) {
  const audio = new Audio('clutch_audio.m4a'); let start = null;
  const loop = ts => { if (start === null) start = ts; renderFrame(((ts - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
  cv.addEventListener('click', () => { start = null; audio.currentTime = 0; audio.play().catch(() => {}); });
}
</script>
